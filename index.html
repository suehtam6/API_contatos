<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contatos</title>
    <script src="./js/app.js" defer type="module"></script>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header>
        <h1>CADASTRO DE CONTATO</h1>
    </header>
    <main>

        <div class="centralizar">
            <div class="conteinarPrincipal">
    
                <div class="conteinarInput">
    
                    <div class="caixaInput">
                        <input type="text" placeholder="Digite o seu nome" id="nome">
                    </div>
    
                    <div class="caixaInput">
                        <input type="text" placeholder="Digite o seu número" id="numero">
                    </div>
    
                    <div class="caixaInput">
                        <input type="text" placeholder="Digite a url da foto" id="foto">
                    </div>
    
                    <div class="caixaInput">
                        <input type="email" placeholder="Digite o seu email" id="email">
                    </div>
    
                    <div class="caixaInput">
                        <input type="text" placeholder="Digite o seu endereco" id="endereco">
                    </div>
    
                    <div class="caixaInput">
                        <input type="text" placeholder="Digite a sua cidade" id="cidade">
                    </div>
    
                </div>
    
                <button id="salvar" class="salvar">SALVAR</button>
                
                <div class="linha"></div>
            </div>
        </div>

        <div id="result">
        </div>

    </main>

    <footer>
        
    </footer>




</body>

</html>
